# Example multi-project Symphony config. Replace these placeholder values with
# your own Linear project slugs, repo sources, workflow paths, and workspace roots.
tracker:
  kind: linear
  endpoint: https://api.linear.app/graphql
  api_key: $LINEAR_API_KEY
  active_states:
    - Todo
    - In Progress
    - Merging
    - Rework
  terminal_states:
    - Closed
    - Cancelled
    - Canceled
    - Duplicate
    - Done

polling:
  interval_ms: 5000

workspace:
  root: ~/work/symphony-workspaces

# Where agents run. Omit this section to run every agent locally on the
# orchestrator host. `worker.mode` is `ssh` (default) or `kubernetes`; the two
# transports are mutually exclusive. OpenCode is local-only and rejects both.
# worker:
#   # --- SSH workers -------------------------------------------------------
#   # Each host must already have the agent binaries, git, gh, and credentials.
#   ssh_hosts:
#     - worker-01
#     - worker-02:2200          # optional custom SSH port
#   max_concurrent_agents_per_host: 4
#
#   # --- Kubernetes workers ------------------------------------------------
#   # Each run gets its own ephemeral pod, launched with a single `kubectl run -i`
#   # connection that Symphony holds open for the run. When the run ends (or the
#   # orchestrator dies) the connection drops and the pod is removed automatically
#   # (`--rm`) — no manual teardown. Requires `kubectl` on the orchestrator with a
#   # working kubeconfig / in-cluster credentials.
#   mode: kubernetes
#   kubernetes:
#     namespace: symphony
#     max_concurrent_pods: 5            # global cap across all runs
#     # container: runner               # which container to exec into (default: first)
#     # kubectl_context: my-cluster     # optional --context
#     # ready_timeout_ms: 120000        # wait-for-Ready timeout (default 120000)
#     # active_deadline_seconds: 3600   # hard k8s-side lifetime backstop (default 3600)
#     # Raw pod spec, passed to `kubectl run --overrides`. Symphony injects
#     # metadata.name / namespace / labels, spec.activeDeadlineSeconds,
#     # spec.shareProcessNamespace: true (so the pause container reaps zombies), and
#     # the container's keep-alive command (it reads stdin and exits on EOF, tying
#     # the pod to the run's connection). Everything else below is yours.
#     pod_template:
#       spec:
#         terminationGracePeriodSeconds: 5
#         containers:
#           # The image MUST contain bash, git, gh, and the agent binary
#           # (codex/claude). Symphony execs `bash -lc ...` into this container for
#           # every step of a run and injects the keep-alive command itself, so you
#           # do NOT need to set `command` (any value is overridden).
#           - name: runner
#             image: ghcr.io/your-org/symphony-runner:latest
#             resources:
#               requests: {cpu: "500m", memory: "1Gi"}
#               limits: {cpu: "2", memory: "4Gi"}

instance:
  name: local-dev

server:
  port: 4000

agent:
  backend: codex
  default_effort: medium
  max_concurrent_agents: 10
  max_turns: 20

codex:
  command: codex --config shell_environment_policy.inherit=all --config model_reasoning_effort=medium --model gpt-5.4 app-server
  approval_policy: never
  thread_sandbox: danger-full-access
  turn_sandbox_policy:
    type: dangerFullAccess

claude:
  command: claude
  permission_mode: bypassPermissions
  turn_sandbox_policy:
    type: dangerFullAccess

opencode:
  command: opencode serve --hostname 127.0.0.1 --port 0
  agent: build

telemetry:
  enabled: false
  # otlp_endpoint: http://localhost:11338
  # otlp_protocol: grpc
  # include_traces: true
  # include_metrics: true
  # include_logs: true
  # resource_attributes:
  #   environment: local-dev

projects:
  # A route can match one or more Linear projects and/or one or more Linear
  # teams. `linear_project`/`linear_projects` and `team`/`teams` all accept a
  # single value or a list. When both projects and teams are set, an issue must
  # match a project AND a team to route here.
  - linear_projects: [project-a, project-a-extra]
    teams: [ENG]
    repo: your-org/project-a
    workflow: WORKFLOW.md
    workspace_root: ~/work/symphony-workspaces/project-a
    backend: codex

  - linear_project: project-b
    repo: your-org/project-b
    workflow: WORKFLOW.md
    default_branch: main
    workspace_root: ~/work/symphony-workspaces/project-b
    backend: claude

  # A team-only route collects every issue in the given team(s), regardless of
  # which Linear project the issue belongs to.
  - teams: [OPS]
    repo: your-org/ops
    workflow: WORKFLOW.md
    workspace_root: ~/work/symphony-workspaces/ops
    backend: claude
